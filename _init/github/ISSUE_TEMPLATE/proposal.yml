# Agent → Human Principal proposal: the discussion surface before a decision. A
# CODEOWNERS-routed decisions.yaml merge ratifies and records the Human decision. Spending
# still requires separate Human execution; org-shape still requires a matching immutable
# control release and explicit Human activation.
name: Proposal
description: "Agent → Human Principal: a bet, spend, or role change that needs a human verdict"
title: "[PROPOSAL] "
labels: ["proposal"]
body:
  - type: textarea
    id: what
    attributes:
      label: What is proposed
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now / expected value
      description: What it unblocks, which metric it moves, and the cheapest test of it.
    validations:
      required: true
  - type: input
    id: cost
    attributes:
      label: Cost (USD + Human Principal minutes)
      placeholder: "e.g. $0 + 10 Human Principal minutes"
    validations:
      required: true
  - type: textarea
    id: reversibility
    attributes:
      label: Reversibility / rollback
      description: One-way doors get extra scrutiny — say which kind this is.
    validations:
      required: true
