# Human Principal work injection (DESIGN.md §2): filing this issue IS the wake.
# The role dropdown maps to a role:* label at triage (runner wake-rules).
#
# HUMAN PRINCIPAL ONLY until scoped portfolio grants land. No project agent opens an
# objective. An agent that finds a mission pillar with no ticket files a [PROPOSAL] naming the
# objective it would open; the Human Principal's filing here is the answer. The dropdown below picks
# the OWNER of the work, never its author.
name: Objective
description: "Human Principal → project cell: an outcome to achieve (project agents file a [PROPOSAL])"
title: "[OBJECTIVE] "
labels: ["objective"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true when this is done? One measurable sentence beats a paragraph.
      placeholder: "e.g. A visitor can buy the product end-to-end and the receipt cites the live checkout URL."
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Accountable role
      options:
{{ROLE_OPTIONS}}
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Budget ceiling, deadline, hard requirements, things explicitly out of scope.
      placeholder: "e.g. $0 pre-spend; no new accounts without a ledger entry; done by Friday."
  - type: input
    id: budget
    attributes:
      label: Budget ceiling (USD)
      placeholder: "0"
