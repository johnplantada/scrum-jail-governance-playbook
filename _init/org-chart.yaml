# ============================================================
# {{PRODUCT}} GOVERNANCE — org-chart.yaml (1.0 role schema)
# ============================================================
# Canonical identities describe capability rather than borrowing human corporate offices.
# GitHub-native authorization remains a platform act: agents propose; the Human Principal's
# merge, review, or manual dispatch decides. Work routes on role:* labels.

schema_version: "1.0"

human_principal:
  kind: human
  github: "{{PRINCIPAL_GITHUB}}"
  authority:
    - ratify_charter
    - authorize_spend
    - deploy_production
    - authorize_external_action
    - clear_halt

# This project cell receives portfolio objectives from an external Portfolio Orchestrator.
# The portfolio runtime is deliberately not embedded in each project-org runtime.
portfolio_orchestrator:
  kind: agent
  scope: portfolio
  external: true
  authority:
    - prioritize_within_ratified_charter
    - allocate_within_ratified_envelope
    - recommend_project_objective
  prohibited:
    - ratify_charter
    - commit_spend
    - deploy_production
    - perform_external_action
    - create_project_objective

governance:
  charter: "change the durable role or authority shape (decisions.yaml type: charter)"
  sunset: "remove a role or service (type: sunset)"
  fund: "spend up to a stated ceiling (type: spend)"
  ship: "production deploy (the Human Principal's manual workflow_dispatch)"
  halt: "whole-cell stop — supervisor-owned; only an authenticated operator clears it"
  promote: "raise an agent role's model profile (type: promote)"

limits:
  # Every parent role plus its max_concurrent worker fan-out. The supervisor enforces this
  # transactionally; deterministic services consume no model thread.
  global_max_agents: {{GLOBAL_MAX_AGENTS}}

global:
  review_interval: {{REVIEW_INTERVAL}}
  pi_interval: {{PI_INTERVAL}}
  unlock_wip_limit: {{UNLOCK_WIP_LIMIT}}
  pm_stages: [Todo, In Progress, Awaiting Merge, Demo, Awaiting Deploy, Done]
  pm_holding_stages: [Blocked, On Hold]
  pm_terminal_stages: [Dropped]

  # Both pins are required commissioning state. The governance monitor refuses to run
  # without them rather than leaving a silently blocked project cell.
  principal_queue_issue: null
  pm_project_number: null

# Provider executables, subscription homes, and concrete model ids are commissioned in
# the installed controller. This workspace carries only provider-neutral model profiles.

# Deterministic components are services, never agents.
services:
  - name: governance-monitor
    kind: deterministic-service
    scope: project
    implementation: scripts/governance_monitor.py
    schedule: "~4h"
    reports_to: human-principal
    judgment_residue_to: governance-reviewer
    consumes_model_tokens: false

roles:
{{ROLES}}
  # Additional roles require a Human Principal-ratified charter change. Use functional
  # ids that name the artifact or decision the role produces; do not mint executive titles.
