# Reference for the enforceable role envelopes compiled from organization.yaml.

worker_fields:
  allowed:
    values: [researcher, drafter, implementer]
    enforcement: controller allowlist; model and tools remain supervisor-selected
  max_per_wake:
    meaning: cumulative accepted worker attempts in one wake
    enforcement: transactional reservation; completion never restores capacity
  max_concurrent:
    meaning: simultaneously accepted or running workers
    enforcement: transactional reservation; cannot exceed max_per_wake
  non_recursive:
    value: true
    enforcement: workers receive neither parent broker socket nor Agent/Task tools

budget_fields:
  daily_token_budget:
    meaning: per-role UTC-day fresh-token ceiling
    enforcement: reserved atomically with the organization bucket before provider start
  organization_daily_tokens:
    meaning: organization-wide UTC-day fresh-token ceiling
    enforcement: the same transaction as the role reservation
  ambiguous_usage:
    behavior: reservation remains charged and enters manual review
  overage:
    behavior: fail closed; never silently release or record free usage

canonical_role_caps:
  project-orchestrator:
    repositories: [org]
    workers: {allowed: [], max_per_wake: 0, max_concurrent: 0}
  commercial-planner:
    repositories: [org]
    workers: {allowed: [researcher, drafter], max_per_wake: 4, max_concurrent: 2}
  software-implementer:
    repositories: [org, product]
    workers: {allowed: [researcher, drafter, implementer], max_per_wake: 4, max_concurrent: 2}
  governance-reviewer:
    repositories: [org]
    workers: {allowed: [], max_per_wake: 0, max_concurrent: 0}
  policy-reviewer:
    optional: true
    repositories: [org]
    workers: {allowed: [researcher, drafter], max_per_wake: 4, max_concurrent: 2}

human_only:
  - objective creation, editing, and closure
  - pull-request merge and auto-merge
  - workflow dispatch and deployment
  - spending authorization and execution
  - repository settings
  - governance installation and activation

notes:
  - Workspace text cannot widen an envelope.
  - can_spend and can_deploy remain false on every generated agent.
  - Dollar spending is not inferred from token accounting; agents have no spend capability.
