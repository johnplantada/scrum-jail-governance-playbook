# TEMPLATE — install only after adapting scripts/ci-demo-evidence.sh in the product repository.
name: Human-dispatched demo evidence

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number under demonstration
        required: true
        type: number
      head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: demo-evidence-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  evidence:
    if: github.actor == vars.HUMAN_PRINCIPAL_LOGIN && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Bind request to the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$EXPECTED_SHA"
          test "${#EXPECTED_SHA}" -eq 40
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Generate evidence without credentials or mutation permissions
        env:
          DEMO_SHA: ${{ inputs.head_sha }}
        run: scripts/ci-demo-evidence.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-evidence-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
