# TEMPLATE — install only after adapting the two named product scripts. The build job has
# no deployment authority. The approval-gated deploy job receives only a sealed artifact
# and never executes files from it.
name: Human-dispatched preview deployment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to preview
        required: true
        type: number
      head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == vars.HUMAN_PRINCIPAL_LOGIN && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Bind request to the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$EXPECTED_SHA"
          test "${#EXPECTED_SHA}" -eq 40
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - name: Build inert preview files
        env:
          PREVIEW_SHA: ${{ inputs.head_sha }}
        run: scripts/ci-preview-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: preview-dist/
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: build
    if: github.actor == vars.HUMAN_PRINCIPAL_LOGIN && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: preview-dist/
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish without executing artifact content
        env:
          PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          test -n "$PREVIEW_BUCKET"
          aws s3 sync preview-dist "s3://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/${HEAD_SHA}/" --delete --no-follow-symlinks
