# TEMPLATE — install only after adapting scripts/ci-review.sh in the product repository.
name: Human-dispatched code review evidence

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to inspect
        required: true
        type: number
      head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: code-review-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  review:
    if: github.actor == vars.HUMAN_PRINCIPAL_LOGIN && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Bind request to the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$EXPECTED_SHA"
          test "${#EXPECTED_SHA}" -eq 40
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run the product's deterministic review floor
        env:
          REVIEWED_SHA: ${{ inputs.head_sha }}
        run: scripts/ci-review.sh
      - name: Prove the checked-out object did not drift
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
