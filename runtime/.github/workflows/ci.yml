name: Human-dispatched release verification

# Hosted jobs consume money and execute repository content. Only the configured Human
# Principal may dispatch this workflow, and only from the protected default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == vars.HUMAN_PRINCIPAL_LOGIN && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify generated provenance before executing repository content
        env:
          SJG_EXPECTED_SOURCE_MANIFEST_SHA256: ${{ vars.SJG_SOURCE_MANIFEST_SHA256 }}
        run: python -I scripts/verify-provenance.py --release
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Python syntax
        run: python -I -m py_compile scripts/*.py
      - name: Complete runtime test suite
        run: make test
      - name: ShellCheck at error severity
        run: shellcheck --severity=error scripts/*.sh scripts/hooks/*
      - name: Working tree remains unchanged
        run: git diff --exit-code && git diff --cached --exit-code
