# Decisions ledger — agent proposals and Human decision records.
#
# An agent proposing a spend, charter, promotion, or sunset opens a PR that appends ONE
# entry here. CODEOWNERS routes the PR to the Human Principal. A merge records the Human
# decision, but executes no spend and activates no governance by itself.
#
# Spending remains a separate Human-only execution. Governance changes require a reviewed,
# matching control release and explicit Human activation. CI validates only record shape.
#
# Entry schema (all fields required unless noted):
#   id:               kebab-case-slug, unique forever
#   type:             spend | charter | promote | sunset
#   role:             proposing canonical agent role
#   what:             the decision, concretely — what will exist/change/be spent
#   why:              expected value — what it unblocks or which metric it moves
#   cost_usd:         number (0 for pure org-shape decisions)
#   principal_minutes: human time the decision commits beyond the merge itself
#   reversibility:    one-way | reversible — plus how to undo it if reversible
#   unblocks:         [work items / issues]
#   proposed:         YYYY-MM-DD
#   payload:          charter/promote/sunset desired-state change for Human review

