schema_version: 1
source_roots:
  - .github
  - _init
  - runtime
  - LICENSE
  - VERSION
  - bin/orggen
  - bin/sjg-install
  - bin/sjg-activate
  - control
  - schemas
  - stamp-manifest.yaml
  - patterns.md
  - safe.md
  - blocker-ledger.md
  - authorization-gate.md
  - envelopes.yaml
  - README.md
  - RUNBOOK.md
  - org-chart.yaml
  - FIELD-NOTES.md
