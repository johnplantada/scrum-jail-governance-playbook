# ============================================================
# SCRUM JAIL GOVERNANCE PLAYBOOK — 1.0 role schema example
# ============================================================
# Functional identities are canonical. Friendly titles may be shown in a UI, but policy,
# grants, logs, labels, and manifests use the ids below.

schema_version: "1.0"

human_principal:
  kind: human
  github: "<your-github-username>"
  authority:
    - ratify_charter
    - authorize_spend
    - deploy_production
    - authorize_external_action
    - clear_halt

portfolio_orchestrator:
  kind: agent
  scope: portfolio
  external: true
  authority:
    - prioritize_within_ratified_charter
    - allocate_within_ratified_envelope
    - recommend_project_objective
  prohibited:
    - ratify_charter
    - commit_spend
    - deploy_production
    - perform_external_action
    - create_project_objective

governance:
  charter: change the durable role or authority shape
  sunset: remove a role or deterministic service
  promote: raise an agent role's model profile
  fund: approve spend up to a stated ceiling
  ship: approve a production deploy
  halt: emergency stop; only a human clears it

limits:
  global_max_agents: 8

global:
  review_interval: 20
  pi_interval: 3
  unlock_wip_limit: 5
  pm_stages: [Todo, In Progress, Awaiting Merge, Demo, Awaiting Deploy, Done]
  pm_holding_stages: [Blocked, On Hold]
  pm_terminal_stages: [Dropped]
  principal_queue_issue: <N>
  pm_project_number: <N>
# Concrete providers and model ids are supervisor-owned commissioning state.

services:
  - name: governance-monitor
    kind: deterministic-service
    scope: project
    implementation: scripts/governance_monitor.py
    schedule: "~4h"
    reports_to: human-principal
    judgment_residue_to: governance-reviewer
    consumes_model_tokens: false

roles:
  - name: project-orchestrator
    kind: agent
    scope: project
    lifetime: resumable
    role: objective-coordination
    reports_to: portfolio-orchestrator
    model_profile: standard
    workers:
      allowed: []
      max_per_wake: 0
      max_concurrent: 0
    envelope:
      daily_token_budget: 300000
      can_spend: false
      can_deploy: false

  - name: commercial-planner
    kind: agent
    scope: project
    lifetime: resumable
    role: commercial-planning
    reports_to: project-orchestrator
    model_profile: standard
    workers:
      allowed: [researcher, drafter]
      max_per_wake: 4
      max_concurrent: 2
    envelope:
      daily_token_budget: 500000
      can_spend: false
      can_deploy: false

  - name: software-implementer
    kind: agent
    scope: project
    lifetime: resumable
    role: software-delivery
    reports_to: project-orchestrator
    model_profile: standard
    workers:
      allowed: [researcher, drafter, implementer]
      max_per_wake: 4
      max_concurrent: 2
    envelope:
      daily_token_budget: 500000
      can_spend: false
      can_deploy: false

  - name: governance-reviewer
    kind: agent
    scope: project
    lifetime: resumable
    role: governance-judgment
    reports_to: human-principal
    model_profile: fast
    workers:
      allowed: []
      max_per_wake: 0
      max_concurrent: 0
    envelope:
      daily_token_budget: 100000
      can_spend: false
      can_deploy: false

